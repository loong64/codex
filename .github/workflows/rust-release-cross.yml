# Release workflow for codex-rs.
# To release, follow a workflow like:
# ```
# git tag -a rust-v0.1.0 -m "Release 0.1.0"
# git push origin rust-v0.1.0
# ```
#
# Tag releases sign macOS binaries and DMGs through the protected `codesigning`
# GitHub environment and Azure Key Vault before final verification on macOS.

name: release
on:
  push:
    tags:
      - "rust-v*.*.*"

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}

# The launcher uses this per-tag group as the migration boundary. Keep shared
# publication jobs on the original queued group below when changing this.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Validate tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Tag validation"

          # Release runs must come from a tag.
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] \
            || { echo "❌  Not a tag ref"; exit 1; }

          tag_ver="${GITHUB_REF_NAME#rust-v}"
          [[ "${GITHUB_REF_NAME}" == rust-v* ]] \
            && python3 .github/scripts/releases.py "${tag_ver}" \
            || { echo "❌  Tag '${GITHUB_REF_NAME}' doesn't match expected format"; exit 1; }

          # Release tags must match the version in Cargo.toml.
          cargo_ver="$(grep -m1 '^version' codex-rs/Cargo.toml \
                        | sed -E 's/version *= *"([^"]+)".*/\1/')"

          [[ "${tag_ver}" == "${cargo_ver}" ]] \
            || { echo "❌  Tag ${tag_ver} ≠ Cargo.toml ${cargo_ver}"; exit 1; }

          echo "✅  Tag and Cargo.toml agree (${tag_ver})"
          echo "::endgroup::"

  build:
    needs: tag-check
    name: Build - ${{ matrix.runner }} - ${{ matrix.target }} - ${{ matrix.bundle }} - ${{ matrix.build-system }}
    # Release Cargo artifacts only while Bazel releases are disabled.
    runs-on: ${{ matrix.runner }}
    environment:
      name: bazel
      deployment: false
    # Linux releases also build the native voice runtime in this job.
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: codex-rs
    env:
      # Preserve Cargo names while teams opt into the additional Bazel artifacts.
      ARTIFACT_SUFFIX: ${{ matrix.build-system == 'bazel' && '-bazel' || '' }}
      # Archive packed macOS dSYMs before stripping the Cargo binaries.
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple-darwin') && 'packed' || 'off' }}
      # The git CLI reliably fetches nested native-library submodules on macOS.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    strategy:
      fail-fast: false
      matrix:
        build-system: [cargo] # Bazel releases are disabled while the BuildBuddy key is revoked.
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - loongarch64-unknown-linux-musl
        bundle: [primary, app-server]
        include:
          # Release artifacts intentionally ship MUSL-linked Linux binaries.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            bundle: primary
            artifact_name: x86_64-unknown-linux-musl
            binaries: "codex codex-code-mode-host codex-exec-server codex-responses-api-proxy bwrap"
            build_dmg: "false"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            bundle: app-server
            artifact_name: x86_64-unknown-linux-musl-app-server
            binaries: "codex-app-server codex-code-mode-host codex-exec-server"
            build_dmg: "false"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            bundle: primary
            artifact_name: aarch64-unknown-linux-musl
            binaries: "codex codex-code-mode-host codex-exec-server codex-responses-api-proxy bwrap"
            build_dmg: "false"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            bundle: app-server
            artifact_name: aarch64-unknown-linux-musl-app-server
            binaries: "codex-app-server codex-code-mode-host codex-exec-server"
            build_dmg: "false"
          - runner: ubuntu-24.04
            target: loongarch64-unknown-linux-musl
            use_qemu: "true"
            bundle: primary
            artifact_name: loongarch64-unknown-linux-musl
            binaries: "codex codex-code-mode-host codex-exec-server codex-responses-api-proxy bwrap"
            build_dmg: "false"
          - runner: ubuntu-24.04
            target: loongarch64-unknown-linux-musl
            use_qemu: "true"
            bundle: app-server
            artifact_name: loongarch64-unknown-linux-musl-app-server
            binaries: "codex-app-server codex-code-mode-host codex-exec-server"
            build_dmg: "false"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Print runner specs (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          cpu_model="$(lscpu | awk -F: '/Model name/ {gsub(/^[ \t]+/, "", $2); print $2; exit}')"
          total_ram="$(awk '/MemTotal/ {printf "%.1f GiB\n", $2 / 1024 / 1024}' /proc/meminfo)"
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: $(uname -a)"
          echo "CPU model: ${cpu_model}"
          echo "Logical CPUs: $(nproc)"
          echo "Total RAM: ${total_ram}"
          echo "Disk usage:"
          df -h .
      - name: Print runner specs (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          total_ram="$(sysctl -n hw.memsize | awk '{printf "%.1f GiB\n", $1 / 1024 / 1024 / 1024}')"
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: $(sw_vers -productName) $(sw_vers -productVersion)"
          echo "Hardware model: $(sysctl -n hw.model)"
          echo "CPU architecture: $(uname -m)"
          echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"
          echo "Physical CPUs: $(sysctl -n hw.physicalcpu)"
          echo "Total RAM: ${total_ram}"
          echo "Disk usage:"
          df -h .
      - name: Install Linux bwrap build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.build-system == 'cargo' && matrix.target || '' }}

      - if: ${{ matrix.build-system == 'cargo' && contains(matrix.target, 'linux') }}
        name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - if: ${{ matrix.build-system == 'cargo' && contains(matrix.target, 'linux') }}
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: true

      - name: Set up QEMU
        if: matrix.use_qemu == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Linux cross compilation (musl)
        if: matrix.use_qemu == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/setup-linux-cross-musl.sh"

      - if: ${{ matrix.build-system == 'cargo' && contains(matrix.target, 'linux') }}
        name: Install musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: ${{ matrix.build-system == 'cargo' && contains(matrix.target, 'linux') }}
        name: Disable aws-lc jitter entropy (musl)
        shell: bash
        run: |
          set -euo pipefail
          # Avoid problematic aws-lc jitter entropy code path on musl builders.
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides and verify checksums
        if: ${{ matrix.build-system == 'cargo' }}
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - if: ${{ matrix.build-system == 'cargo' && contains(matrix.target, 'linux') }}
        name: Build bwrap and export digest
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --target "$target" --release --timings --bin bwrap

          bwrap_path="target/${target}/release/bwrap"
          if [[ ! -f "$bwrap_path" ]]; then
            echo "bwrap binary ${bwrap_path} not found"
            exit 1
          fi

          # Codex embeds this digest at build time and verifies the bundled
          # bwrap resource before use. Strip bwrap before hashing so the digest
          # covers the exact bytes that the release packages.
          "${STRIP:-strip}" --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "Built bwrap ${bwrap_path} with sha256:${digest}"

      - name: Cargo build
        if: ${{ matrix.build-system == 'cargo' }}
        shell: bash
        run: |
          target="${{ matrix.target }}"
          build_args=()
          for binary in ${{ matrix.binaries }}; do
            # bwrap was built, finalized, and hashed before this build so
            # Codex can embed the digest of the bytes that will be packaged.
            if [[ "$binary" == "bwrap" ]]; then
              continue
            fi
            build_args+=(--bin "$binary")
          done
          STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          export STABLE_GIT_COMMIT
          cargo build --target "$target" --release --timings "${build_args[@]}"

      - name: Prepare Bazel for release binaries or Linux voice
        if: matrix.build-system == 'bazel' || (matrix.bundle == 'primary' && contains(matrix.target, 'linux'))
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-release-${{ matrix.bundle }}

      - name: Build Bazel release binaries and symbols
        if: ${{ matrix.build-system == 'bazel' }}
        uses: ./.github/actions/build-bazel-release
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        with:
          target: ${{ matrix.target }}
          bundle: ${{ matrix.bundle }}
          release-dir: ${{ github.workspace }}/codex-rs/target/${{ matrix.target }}/release

      - name: Build symbols archive and strip binaries
        shell: bash
        run: |
          binaries=()
          for binary in ${{ matrix.binaries }}; do
            # bwrap is already stripped before hashing. Its symbols are not
            # useful enough to justify a separate pre-Codex symbols pass.
            if [[ "$binary" == "bwrap" ]]; then
              continue
            fi
            binaries+=("$binary")
          done
          bash "${GITHUB_WORKSPACE}/.github/scripts/archive-release-symbols-and-strip-binaries.sh" \
            --target "${{ matrix.target }}" \
            --artifact-name "${{ matrix.artifact_name }}" \
            --release-dir "target/${{ matrix.target }}/release" \
            --archive-dir "symbols-dist/${{ matrix.artifact_name }}" \
            --binaries "${binaries[*]}"

      - name: Suffix Bazel artifact filenames
        if: ${{ matrix.build-system == 'bazel' }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact in "symbols-dist/${{ matrix.artifact_name }}"/*; do
            name="${artifact##*/}"
            stem="${name%%.*}"
            mv "$artifact" "${artifact%/*}/${stem}-bazel${name#"$stem"}"
          done

      - name: Upload symbols archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact_name }}-symbols${{ env.ARTIFACT_SUFFIX }}
          path: codex-rs/symbols-dist/${{ matrix.artifact_name }}/*
          if-no-files-found: error

      - name: Build Linux cross voice runtime
        if: ${{ matrix.bundle == 'primary' && matrix.use_qemu == 'true' }}
        env:
          APP_TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/build-linux-cross-voice.sh"

      - name: Build Linux voice runtime
        if: ${{ matrix.bundle == 'primary' && contains(matrix.target, 'linux') && matrix.use_qemu != 'true' }}
        shell: bash
        env:
          APP_TARGET: ${{ matrix.target }}
          # Use local Bazel while BuildBuddy credentials are unavailable.
          BUILDBUDDY_API_KEY: ""
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          voice_target="${APP_TARGET%-musl}-gnu"
          case "$voice_target" in
            aarch64-unknown-linux-gnu) prefix=linux_aarch64 ;;
            x86_64-unknown-linux-gnu) prefix=linux_x86_64 ;;
            *) exit 1 ;;
          esac
          python3 .github/scripts/run_bazel_with_buildbuddy.py build --config=release \
            //codex-rs/voice-host:codex-voice-host //third_party/voice:native_runtime
          source="bazel-bin/third_party/voice/native_runtime_${prefix}"
          output="${RUNNER_TEMP}/signed-voice/${APP_TARGET}"
          mkdir -p "$output"
          python3 third_party/voice/release_runtime.py stage \
            --target "$voice_target" --source "$source" --output "$output/runtime"
          cp bazel-bin/codex-rs/voice-host/codex-voice-host "$output/codex-voice-host"
          chmod 0755 "$output/codex-voice-host"
          python3 third_party/voice/release_runtime.py seal \
            --target "$voice_target" --output "$output/runtime"

      - if: ${{ runner.os == 'macOS' }}
        name: Stage unsigned macOS artifacts
        shell: bash
        run: |
          set -euo pipefail

          target="${{ matrix.target }}"
          release_dir="target/${target}/release"
          dest="unsigned-dist/${target}"
          mkdir -p "$dest"

          for binary in ${{ matrix.binaries }}; do
            binary_path="${release_dir}/${binary}"
            unsigned_name="${binary}-${target}-unsigned"
            unsigned_path="${dest}/${unsigned_name}"
            if [[ ! -f "${binary_path}" ]]; then
              echo "Binary ${binary_path} not found"
              exit 1
            fi

            cp "${binary_path}" "${unsigned_path}"
            tar -C "$dest" -czf "${unsigned_path}.tar.gz" "${unsigned_name}"
            zstd -T0 -19 --rm "${unsigned_path}"
          done

      - if: ${{ runner.os == 'macOS' }}
        name: Upload unsigned macOS artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact_name }}-unsigned${{ env.ARTIFACT_SUFFIX }}
          path: codex-rs/unsigned-dist/${{ matrix.target }}/*
          if-no-files-found: error

      - if: ${{ contains(matrix.target, 'linux') }}
        name: Cosign Linux artifacts
        uses: ./.github/actions/linux-code-sign
        with:
          target: ${{ matrix.target }}
          artifacts-dir: ${{ github.workspace }}/codex-rs/target/${{ matrix.target }}/release
          binaries: ${{ matrix.binaries }}

      - name: Stage artifacts
        if: ${{ runner.os != 'macOS' }}
        shell: bash
        run: |
          dest="dist/${{ matrix.target }}"
          mkdir -p "$dest"

          for binary in ${{ matrix.binaries }}; do
            # Both variants package the host and executor; only the primary publishes
            # standalone binary archives to avoid duplicate release asset names.
            if [[ "${{ matrix.bundle }}" == "app-server" && ( "$binary" == "codex-code-mode-host" || "$binary" == "codex-exec-server" ) ]]; then
              continue
            fi
            cp "target/${{ matrix.target }}/release/${binary}" "$dest/${binary}-${{ matrix.target }}"
            if [[ "${{ matrix.target }}" == *linux* ]]; then
              cp "target/${{ matrix.target }}/release/${binary}.sigstore" \
                "$dest/${binary}-${{ matrix.target }}.sigstore"
            fi
          done

          if [[ "${{ matrix.build_dmg }}" == "true" ]]; then
            cp target/${{ matrix.target }}/release/codex-${{ matrix.target }}.dmg "$dest/codex-${{ matrix.target }}.dmg"
          fi

      - name: Build Codex package archive
        if: ${{ runner.os != 'macOS' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          voice_args=()
          if [[ "$BUNDLE" == "primary" && "$TARGET" == *-unknown-linux-musl ]]; then
            voice_args+=(--voice-release-dir "${RUNNER_TEMP}/signed-voice/${TARGET}")
            voice_args+=(--release-version "${GITHUB_REF_NAME#rust-v}")
          fi
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target "$TARGET" \
            --bundle "$BUNDLE" \
            --entrypoint-dir "target/${TARGET}/release" \
            --archive-dir "dist/${TARGET}" \
            "${voice_args[@]}"

      - name: Cosign Linux voice package archives
        if: ${{ matrix.bundle == 'primary' && contains(matrix.target, 'linux') }}
        uses: ./.github/actions/linux-code-sign
        with:
          target: ${{ matrix.target }}
          artifacts-dir: ${{ github.workspace }}/codex-rs/dist/${{ matrix.target }}
          binaries: codex-package-${{ matrix.target }}.tar.gz codex-package-${{ matrix.target }}.tar.zst

      - name: Set up Python release tools
        if: ${{ matrix.build-system == 'cargo' && matrix.bundle == 'primary' && runner.os != 'macOS' }}
        uses: ./.github/actions/setup-python-release-tools
        with:
          group: runtime

      - name: Build Python runtime wheel
        if: ${{ matrix.build-system == 'cargo' && matrix.bundle == 'primary' && runner.os != 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              platform_tag="macosx_11_0_arm64"
              ;;
            x86_64-apple-darwin)
              platform_tag="macosx_10_9_x86_64"
              ;;
            aarch64-unknown-linux-musl)
              platform_tag="manylinux_2_17_aarch64"
              ;;
            x86_64-unknown-linux-musl)
              platform_tag="manylinux_2_17_x86_64"
              ;;
            loongarch64-unknown-linux-musl)
              platform_tag="manylinux_2_36_loongarch64"
              ;;
            *)
              echo "No Python runtime wheel platform tag for ${{ matrix.target }}"
              exit 1
              ;;
          esac

          # Keep the existing manylinux_2_17 wheel compatible with older glibc.
          # GNU voice libraries belong in the signed release package archives,
          # but their minimum glibc version is not covered by this wheel tag.
          wheel_archives="${RUNNER_TEMP}/voice-free-wheel/${{ matrix.target }}"
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target "${{ matrix.target }}" \
            --bundle primary \
            --entrypoint-dir "target/${{ matrix.target }}/release" \
            --archive-dir "$wheel_archives"
          wheel_archive="${wheel_archives}/codex-package-${{ matrix.target }}.tar.gz"
          python3 - "$wheel_archive" <<'PY'
          import sys
          import tarfile
          with tarfile.open(sys.argv[1]) as archive:
              assert not any("codex-resources/voice/" in item.name for item in archive)
          PY

          stage_dir="${RUNNER_TEMP}/openai-codex-cli-bin-${{ matrix.target }}"
          wheel_dir="${GITHUB_WORKSPACE}/python-runtime-dist/${{ matrix.target }}"
          stage_runtime_args=(
            "${GITHUB_WORKSPACE}/sdk/python/scripts/update_sdk_artifacts.py"
            stage-runtime
            "$stage_dir"
            "$wheel_archive"
            --codex-version "${GITHUB_REF_NAME}"
            --platform-tag "$platform_tag"
          )
          python3 "${stage_runtime_args[@]}"
          uv build --offline --no-build-isolation --no-create-gitignore \
            --python "${RUNNER_TEMP}/python-runtime-build-venv" --wheel --out-dir "$wheel_dir" "$stage_dir"

      - name: Upload Python runtime wheel
        if: ${{ matrix.build-system == 'cargo' && matrix.bundle == 'primary' && runner.os != 'macOS' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-runtime-wheel-${{ matrix.target }}
          path: python-runtime-dist/${{ matrix.target }}/*.whl
          if-no-files-found: error

      - name: Compress artifacts
        if: ${{ runner.os != 'macOS' }}
        shell: bash
        run: |
          # Path that contains the uncompressed binaries for the current
          # ${{ matrix.target }}
          dest="dist/${{ matrix.target }}"

          # For compatibility with environments that lack the `zstd` tool we
          # additionally create a `.tar.gz` alongside every binary we publish.
          # The end result is:
          #   codex-<target>.zst          (existing)
          #   codex-<target>.tar.gz       (new)

          # 1. Produce a .tar.gz for every file in the directory *before* we
          #    run `zstd --rm`, because that flag deletes the original files.
          for f in "$dest"/*; do
            base="$(basename "$f")"
            # Skip files that are already archives (shouldn't happen, but be
            # safe).
            if [[ "$base" == *.tar.gz || "$base" == *.tar.zst || "$base" == *.zip || "$base" == *.dmg ]]; then
              continue
            fi

            # Don't try to compress signature bundles.
            if [[ "$base" == *.sigstore ]]; then
              continue
            fi

            # Create per-binary tar.gz
            tar -C "$dest" -czf "$dest/${base}.tar.gz" "$base"

            # Also create .zst and remove the uncompressed binaries to keep
            # non-Windows artifact directories small.
            zstd -T0 -19 --rm "$dest/$base"
          done

      - name: Suffix Bazel artifact filenames
        if: ${{ matrix.build-system == 'bazel' && runner.os != 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact in "dist/${{ matrix.target }}"/*; do
            name="${artifact##*/}"
            stem="${name%%.*}"
            mv "$artifact" "${artifact%/*}/${stem}-bazel${name#"$stem"}"
          done

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ runner.os != 'macOS' }}
        with:
          name: ${{ matrix.artifact_name }}${{ env.ARTIFACT_SUFFIX }}
          # Upload the per-binary .zst files, .tar.gz equivalents, and any
          # prebuilt archives staged above.
          path: |
            codex-rs/dist/${{ matrix.target }}/*

  stage-npm-packages:
    name: stage npm packages
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{aarch64,x86_64,loongarch64}-{apple-darwin{,-app-server},unknown-linux-musl{,-app-server},pc-windows-msvc}"

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js for npm packaging
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage npm packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#rust-v}"
          ./scripts/stage_npm_packages.py \
            --release-version "$release_version" \
            --artifacts-dir "${GITHUB_WORKSPACE}/dist" \
            --package codex \
            --package codex-responses-api-proxy \
            --package codex-sdk

      - name: Upload staged npm packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error

  release:
    # Each job checks its channel under this lock; out-of-order builds cannot
    # roll back GitHub, npm, R2, or the canary branch.
    concurrency: &release-publication
      group: rust-release
      queue: max
      cancel-in-progress: false
    needs:
      - tag-check
      - build
      - stage-npm-packages
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release_name.outputs.name }}
      tag: ${{ github.ref_name }}
      make_latest: ${{ steps.release_name.outputs.make_latest }}
      prerelease: ${{ steps.release_name.outputs.prerelease }}
      should_publish_npm: ${{ steps.npm_publish_settings.outputs.should_publish }}
      npm_tag: ${{ steps.npm_publish_settings.outputs.npm_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Generate release notes from tag commit message
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          # On tag pushes, GITHUB_SHA may be a tag object for annotated tags;
          # peel it to the underlying commit.
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          notes_path="${RUNNER_TEMP}/release-notes.md"

          # Use the commit message for the commit the tag points at (not the
          # annotated tag message).
          # Preserve the previous publisher's 124,999-character cap, reserving
          # the last character for a trailing newline for GitHub's renderer.
          git log -1 --format=%B "${commit}" |
            python3 -c 'import sys; print(sys.stdin.read()[:124998])' > "${notes_path}"

          echo "path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{{aarch64,x86_64,loongarch64}-{apple-darwin{,-app-server},unknown-linux-musl{,-app-server},pc-windows-msvc},*-symbols,argument-comment-lint-*,python-runtime-wheel-*,npm-packages}"

      - name: Download verified provisioned macOS packages
        if: vars.CODEX_PROVISIONED_MACOS_CANDIDATE == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "provisioned-macos-verified-candidate-*"

      - name: Remove per-architecture checksum filenames before release upload
        if: vars.CODEX_PROVISIONED_MACOS_CANDIDATE == 'true'
        run: rm dist/provisioned-macos-verified-candidate-*/SHA256SUMS

      - name: List
        run: ls -R dist/

      - name: Add Codex package checksum manifest
        run: |
          set -euo pipefail

          manifest="dist/codex-package_SHA256SUMS"
          tmp_manifest="$(mktemp)"
          find dist -type f \
            \( -name 'codex-package-*.tar.gz' -o -name 'codex-app-server-package-*.tar.gz' -o -name 'codex-provisioned-package-*.tar.gz' \) \
            -print |
            sort |
            while IFS= read -r archive; do
              sha256sum "$archive" |
                awk -v name="$(basename "$archive")" '{ print $1 "  " name }'
            done > "$tmp_manifest"

          if [[ ! -s "$tmp_manifest" ]]; then
            echo "No Codex package archives found for checksum manifest"
            exit 1
          fi

          mv "$tmp_manifest" "$manifest"
          cat "$manifest"

      - name: Add config schema release asset
        run: |
          cp codex-rs/core/config.schema.json dist/config-schema.json

      - name: Define release name
        id: release_name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Extract the version from the tag name, which is in the format
          # "rust-v0.1.0".
          version="${GITHUB_REF_NAME#rust-v}"
          echo "name=${version}" >> $GITHUB_OUTPUT
          if [[ "${version}" == *-* ]]; then
            echo "make_latest=false" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            make_latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
              | python3 .github/scripts/releases.py "$version" --check-github latest)"
            echo "make_latest=${make_latest}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine npm publish settings
        id: npm_publish_settings
        env:
          VERSION: ${{ steps.release_name.outputs.name }}
        run: |
          set -euo pipefail
          version="${VERSION}"

          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=" >> "$GITHUB_OUTPUT"
          elif [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage installer scripts
        run: |
          cp scripts/install/install.sh dist/install.sh
          # mv dist/x86_64-pc-windows-msvc/install.ps1 dist/install.ps1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ steps.release_name.outputs.name }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.path }}
          MAKE_LATEST: ${{ steps.release_name.outputs.make_latest }}
          PRERELEASE: ${{ steps.release_name.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Look up this tag, including drafts, without listing release history.
          # API errors must fail the step rather than look like an absent release.
          # shellcheck disable=SC2016
          exists="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$tag:String!){repository(owner:$owner,name:$repo){release(tagName:$tag){databaseId}}}' \
            -f owner="$GITHUB_REPOSITORY_OWNER" \
            -f repo="${GITHUB_REPOSITORY#*/}" \
            -f tag="$GITHUB_REF_NAME" \
            --jq '.data.repository.release != null')"
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --title "$RELEASE_NAME"
            --notes-file "$RELEASE_NOTES"
            --prerelease="$PRERELEASE"
          )
          if [[ "$exists" == false ]]; then
            # Prereleases must be created directly to keep prereleased events.
            draft=true
            if [[ "$PRERELEASE" == true ]]; then
              draft=false
            fi
            gh release create "$GITHUB_REF_NAME" "${release_args[@]}" \
              --draft="$draft" --verify-tag --latest=false
          fi

          mapfile -d '' assets < <(find dist -type f -print0 | sort -z)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" "${release_args[@]}" \
            --draft=false --latest="$MAKE_LATEST"

